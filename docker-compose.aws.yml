services:

  api:
    build: .
    container_name: jarvis_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      GROQ_API_KEY: ${GROQ_API_KEY}
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
    depends_on:
      - db
      - redis
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  worker:
    build: .
    container_name: jarvis_worker
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=1
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      GROQ_API_KEY: ${GROQ_API_KEY}
    depends_on:
      - db
      - redis
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  db:
    image: ankane/pgvector
    container_name: jarvis_db
    environment:
      POSTGRES_DB: intelligent_dictionary
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-securepassword123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  redis:
    image: redis:7
    container_name: jarvis_redis
    command: redis-server --maxmemory 50mb --maxmemory-policy allkeys-lru
    restart: always
    deploy:
      resources:
        limits:
          memory: 64M

  frontend:
    build: ./frontend
    container_name: jarvis_frontend
    ports:
      - "80:80"
    depends_on:
      - api
    restart: always
    deploy:
      resources:
        limits:
          memory: 32M

volumes:
  postgres_data:
